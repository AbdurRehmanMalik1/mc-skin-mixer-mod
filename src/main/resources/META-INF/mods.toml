modLoader="javafml"
loaderVersion="[${forge_min_version},)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${author_name}"
# Optional on either side: clients without it can join a server with it, and the other way round.
displayTest="IGNORE_ALL_VERSION"
description="${mod_description}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_min_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_min_version},${minecraft_max_version})"
    ordering="NONE"
    side="BOTH"
