plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"skinmixer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Multiplayer testing on one PC: runServer uses run/, each client gets its own folder and name,
	// so a server and two clients can run at once and see each other's outfits.
	runs {
		client {
			runDir "run/client1"
			programArgs "--username", "Player1"
		}
		client2 {
			client()
			source sourceSets.client
			name "Minecraft Client 2"
			runDir "run/client2"
			programArgs "--username", "Player2"
		}
	}
}

// Scripted client check: ./gradlew runClientE2E. It opens a game window for about a minute, drives the
// menu, checks the baked skin pixel by pixel and screenshots into build/run/clientE2E/screenshots; it
// exits with status 1 if a check fails, so it isn't part of ./gradlew build. Fabric's client game tests
// start at 1.21.4, so this version uses its own. Source in src/e2e, never in the mod jar.
sourceSets {
	e2e {
		compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
		runtimeClasspath += main.runtimeClasspath + main.output + client.runtimeClasspath + client.output
	}
}

loom {
	mods {
		"skinmixer-e2e" {
			sourceSet sourceSets.e2e
		}
	}
	runs {
		clientE2E {
			client()
			name "Client E2E"
			source sourceSets.e2e
			runDir "build/run/clientE2E"
			programArgs "--username", "Player1"
			vmArg "-Dskinmixer.clientE2E=true"
		}
	}
}

afterEvaluate {
	tasks.named("runClientE2E") {
		def options = file("build/run/clientE2E/options.txt")
		doFirst {
			// Quiet, no first-launch screens, and a window in the background doesn't pause the game.
			options.parentFile.mkdirs()
			options.text = "onboardAccessibility:false\npauseOnLostFocus:false\nsoundCategory_master:0.0\ntutorialStep:none\nskipMultiplayerWarning:true\n"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
