plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

neoForge {
    version = project.neo_version

    runs {
        // Multiplayer testing on one PC: runServer uses run/, each client gets its own folder and name,
        // so a server and two clients can run at once and see each other's outfits.
        client {
            client()
            gameDirectory = project.file('run/client1')
            programArguments.addAll '--username', 'Player1'
        }

        client2 {
            client()
            gameDirectory = project.file('run/client2')
            programArguments.addAll '--username', 'Player2'
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            mod_id                 : mod_id,
            version                : version,
            mod_version            : mod_version,
            mod_name               : mod_name,
            mod_description        : mod_description,
            mod_license            : mod_license,
            author_name            : author_name,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE'))
    manifest {
        attributes([
                "Specification-Title"   : mod_name,
                "Specification-Vendor"  : author_name,
                "Specification-Version" : mod_version,
                "Implementation-Title"  : mod_name,
                "Implementation-Vendor" : author_name,
                "Implementation-Version": mod_version,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Scripted client check: ./gradlew runClientE2E. It opens a game window for about a minute, drives the
// menu, checks the baked skin pixel by pixel and screenshots into build/run/clientE2E/screenshots; it
// exits with status 1 if a check fails. The test lives in its own source set (src/e2e), joins the mod
// only in dev runs, and never goes into the mod jar.
sourceSets {
    e2e {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    addModdingDependenciesTo(sourceSets.e2e)
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.e2e)
        }
    }
    runs {
        clientE2E {
            client()
            sourceSet = sourceSets.e2e
            gameDirectory = project.file('build/run/clientE2E')
            programArguments.addAll '--username', 'Player1'
            systemProperty 'skinmixer.clientE2E', 'true'
        }
    }
}

tasks.matching { it.name == 'runClientE2E' }.configureEach {
    def options = file('build/run/clientE2E/options.txt')
    doFirst {
        // Quiet, no first-launch screens, and a window in the background doesn't pause the game.
        options.parentFile.mkdirs()
        options.text = "onboardAccessibility:false\npauseOnLostFocus:false\nsoundCategory_master:0.0\ntutorialStep:none\nskipMultiplayerWarning:true\n"
    }
}
