buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.16'
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
// The skin hook is a mixin (Forge has no event for which skin a player wears), so the refmap is built.
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'
apply plugin: 'idea'

version = "${minecraft_version}-${mod_version}"
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        // Multiplayer testing on one PC: runServer uses run/, each client gets its own folder and name,
        // so a server and two clients can run at once and see each other's outfits.
        // The username lives only on the children: a parent's args are copied into them, and a second
        // --username makes the game exit on launch.
        client1 {
            parent runs.client
            workingDirectory project.file('run/client1')
            args '--username', 'Player1'
        }

        client2 {
            parent runs.client
            workingDirectory project.file('run/client2')
            args '--username', 'Player2'
        }

        server {
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources) {
    def properties = [
            mod_id: mod_id,
            version: version,
            mod_version: mod_version,
            mod_name: mod_name,
            mod_description: mod_description,
            mod_license: mod_license,
            author_name: author_name,
            minecraft_min_version: minecraft_min_version,
            minecraft_max_version: minecraft_max_version,
            forge_min_version: forge_min_version,
    ]
    inputs.properties properties

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE'))
    manifest {
        attributes([
                "Specification-Title"     : mod_name,
                "Specification-Vendor"    : author_name,
                "Specification-Version"   : mod_version,
                "Implementation-Title"    : mod_name,
                "Implementation-Vendor"   : author_name,
                "Implementation-Version"  : mod_version,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Scripted client check: ./gradlew runClientE2E. It opens a game window for about a minute, drives the
// menu, checks the baked skin pixel by pixel and screenshots into build/run/clientE2E/screenshots; it
// exits with status 1 if a check fails. The test lives in its own source set (src/e2e), joins the mod
// only in this run, and never goes into the mod jar.
sourceSets {
    e2e {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

minecraft {
    runs {
        clientE2E {
            parent runs.client
            workingDirectory project.file('build/run/clientE2E')
            args '--username', 'Player1'
            property 'skinmixer.clientE2E', 'true'
            mods {
                skinmixer {
                    source sourceSets.main
                    source sourceSets.e2e
                }
            }
        }
    }
}

tasks.matching { it.name == 'runClientE2E' }.configureEach {
    def options = file('build/run/clientE2E/options.txt')
    doFirst {
        // Quiet, no first-launch screens, and a window in the background doesn't pause the game.
        options.parentFile.mkdirs()
        options.text = "pauseOnLostFocus:false\nsoundCategory_master:0.0\ntutorialStep:none\nskipMultiplayerWarning:true\nonboardAccessibility:false\n"
    }
}
